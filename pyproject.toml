[project]
name = "dancebot"
version = "0.1.0"
description = "Make a LeRobot SO-101 arm dance to any song, locked to the beat."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "sounddevice",
    "librosa",
    # robot
    "lerobot[feetech]",
    # Beat This! neural beat tracker
    "beat-this @ https://github.com/CPJKU/beat_this/archive/main.zip",
    "rotary-embedding-torch",
    "torch",
    "torchaudio",
    "einops",
    "soxr",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
dancebot = "dancebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dancebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
